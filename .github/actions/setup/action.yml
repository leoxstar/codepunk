name: Setup Codepunk workspace
description: Set up pnpm, Node.js from .node-version, and install workspace dependencies
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
