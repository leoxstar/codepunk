  "@earendil-works/pi-coding-agent": "1.6.0"
  "@earendil-works/pi-mcp": "1.6.0"
  "@earendil-works/pi-tui": "1.6.0"
  "@eslint/js": "10.0.1"
  "@types/node": "22.19.1"
  "@typescript/native": "npm:typescript@7.0.2"
  esbuild: "0.25.11"
  eslint: "10.15.0"
  eslint-plugin-import-x: "4.18.1"
  node-pty: "1.1.0"
